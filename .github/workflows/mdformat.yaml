---
name: Mdformat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mdformat:
    name: Markdown formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mdformat>=1.0.0" "mdformat-myst>=0.3.0" "mdformat-front-matters>=2.0.0"

      - name: Run mdformat (check only)
        run: |
          mdformat --check --wrap no --number docs/*.md
          mdformat --check --wrap no --number *.md .github/*.md .github/instructions/*.md .claude/rules/*.md
