[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "hedvis"
version = "0.1.1"
description = "HED validation, summary, and analysis tools for annotating events and experimental metadata."
readme = "README.md"
authors = [
    { name = "VisLab" },
    { name = "Ian Callanan" },
    { name = "Kay Robbins", email = "Kay.Robbins@utsa.edu" },
]
maintainers = [
    { name = "HED Maintainers", email = "hed.maintainers@gmail.com" },
]
license = {text = "MIT"}
keywords = ["HED", "hierarchical event descriptors", "validation", "neuroscience", "BIDS", "events", "metadata", "annotation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
]

requires-python = ">=3.10"

dependencies = [
    "hedtools>=1.2.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.3,<3.0.0",
    "numpy",
    "pillow>=11.2.1",
    "wordcloud>=1.9.4",
]

[project.urls]
"Homepage" = "https://www.hedtags.org/"
"Documentation" = "https://www.hedtags.org/hed-python"
"Repository" = "https://github.com/hed-standard/hed-vis"
"Bug Tracker" = "https://github.com/hed-standard/hed-vis/issues"
"Changelog" = "https://github.com/hed-standard/hed-vis/blob/main/CHANGELOG.md"
"HED Resources" = "https://www.hedtags.org/hed-resources"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "typos>=1.29.0",
    "mdformat>=1.0.0",
    "mdformat-myst>=0.3.0",
    "coverage>=7.0.0",
]
docs = [
    "sphinx>=7.1.0,<10.0",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=3.0.0",
    "sphinx-autodoc-typehints>=3.0.0,<3.12.1",
    "linkify-it-py>=2.0.3",
]

[tool.setuptools.packages.find]
where = [""]
include = ["hedvis*"]
namespaces = false

[tool.setuptools.package-data]
hedvis = []

[tool.typos.files]
extend-exclude = [
    "*.pdf",
    "*.svg",
    "deprecated/",
    "venv*/",
    "*.tsv",
    "*.yaml",
    "*.yml",
    "*.json",
    "*.rdf",
    "*.jsonld",
    "tests/",
    "*.xml",
    "*.mediawiki",
    "*.omn",
    "*.toml",
]

[tool.typos.default.extend-words]
# Domain-specific terms and abbreviations that are not typos
te = "te"
parms = "parms"
assertIn = "assertIn"
covert = "covert"
hed = "hed"
recuse = "recuse"
disjointness = "disjointness"

[tool.typos.default.extend-identifiers]
# Misspelling in upstream wordcloud library's private API
_get_bolean_mask = "_get_bolean_mask"

[tool.ruff]
# Target Python 3.10+
target-version = "py310"
line-length = 120

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".status",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "N802",  # camelCase test methods (legacy convention)
    "N803",  # non-lowercase argument names (scientific code)
    "N806",  # non-lowercase variables in functions (scientific code)
]

# __init__.py files: unused imports are re-exports, and their import order is
# curated by hand to avoid circular imports - isort must not reorder them.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["hedvis"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
